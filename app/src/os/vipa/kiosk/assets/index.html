<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>vipa</title>
<style>
  html,body{margin:0;padding:0;background:#000;color:#eaeaea;
    font-family:-apple-system,"Hiragino Sans",sans-serif;
    -webkit-user-select:none;height:100%;
    -webkit-text-size-adjust:none;text-size-adjust:none}
  body{display:-webkit-box;display:flex;-webkit-box-orient:vertical;
    flex-direction:column}

  /* full width, natural proportion (1x) */
  .hd{-webkit-box-flex:0;flex:0 0 auto;display:block;
      width:100%;height:auto;margin:0;padding:0;border:0}

  .thread{position:relative;-webkit-box-flex:1;flex:1;overflow-y:auto;overflow-x:hidden;
    padding:14px 0 112px;display:-webkit-box;display:flex;
    -webkit-box-orient:vertical;flex-direction:column}

  .b{max-width:82%;padding:9px 12px;border-radius:16px;
     font-size:15px;line-height:1.5;word-wrap:break-word;
     margin:0 0 11px}
  .ai{-webkit-align-self:flex-start;align-self:flex-start;
      background:#131313;color:#ededed;border:1px solid #222;
      border-bottom-left-radius:4px}
  .me{-webkit-align-self:flex-end;align-self:flex-end;
      background:#f1f1f1;color:#0d0d0d;border-bottom-right-radius:4px;
      white-space:pre-wrap}

  .b p{margin:0 0 6px}
  .b p:last-child{margin-bottom:0}
  .b h3{margin:2px 0 6px;font-size:15.5px;font-weight:600}
  .b ul,.b ol{margin:2px 0 6px;padding-left:19px}
  .b li{margin:1px 0}
  .b strong{font-weight:600;color:#fff}
  .b code{background:#232323;padding:1px 4px;border-radius:4px;font-size:13px}
  .b pre{background:#0c0c0c;border:1px solid #222;border-radius:9px;
    padding:8px 10px;margin:6px 0;overflow-x:auto}
  .b pre code{background:none;padding:0;font-size:12.5px;
    white-space:pre-wrap;word-break:break-word}

  .typing{display:none;-webkit-align-self:flex-start;align-self:flex-start;
    margin:0 0 11px;padding:10px 13px;border-radius:16px;
    border-bottom-left-radius:4px;background:#131313;border:1px solid #222}
  .typing.on{display:-webkit-box;display:flex;-webkit-box-align:center;
    align-items:center}
  .typing .t{font-size:12px;color:#8d8d8d;margin-left:9px}

  /* recording: a live bar meter on the user side */
  .rec{display:none;-webkit-align-self:flex-end;align-self:flex-end;
    margin:0 0 11px;padding:10px 14px;border-radius:16px;
    border-bottom-right-radius:4px;background:#f1f1f1;color:#0d0d0d;
    -webkit-box-align:center;align-items:center}
  .rec.on{display:-webkit-box;display:flex}
  .rec .bars{display:-webkit-box;display:flex;-webkit-box-align:end;align-items:flex-end;
    height:18px;margin-right:9px}
  .rec .bars b{display:block;width:3px;margin-right:3px;background:#0d0d0d;border-radius:2px;
    -webkit-animation:pulse 900ms ease-in-out infinite;animation:pulse 900ms ease-in-out infinite}
  .rec .bars b:nth-child(1){height:6px;-webkit-animation-delay:0ms;animation-delay:0ms}
  .rec .bars b:nth-child(2){height:14px;-webkit-animation-delay:120ms;animation-delay:120ms}
  .rec .bars b:nth-child(3){height:9px;-webkit-animation-delay:240ms;animation-delay:240ms}
  .rec .bars b:nth-child(4){height:16px;-webkit-animation-delay:360ms;animation-delay:360ms}
  .rec .t{font-size:12px;letter-spacing:.04em}
  @-webkit-keyframes pulse{0%,100%{height:4px;opacity:.45}50%{height:18px;opacity:1}}
  @keyframes pulse{0%,100%{height:4px;opacity:.45}50%{height:18px;opacity:1}}

  .flower{position:relative;width:24px;height:24px;flex:0 0 auto}
  .flower b{position:absolute;left:50%;top:50%;width:5px;height:8px;
    margin:-4px 0 0 -2.5px;border-radius:50%;background:#e9e9e9;opacity:.16;
    -webkit-animation:bloom 1.7s ease-in-out infinite;
    animation:bloom 1.7s ease-in-out infinite}
  .flower b:nth-child(1){-webkit-transform:rotate(0deg) translateY(-7px);
    transform:rotate(0deg) translateY(-7px)}
  .flower b:nth-child(2){-webkit-transform:rotate(60deg) translateY(-7px);
    transform:rotate(60deg) translateY(-7px);-webkit-animation-delay:.14s}
  .flower b:nth-child(3){-webkit-transform:rotate(120deg) translateY(-7px);
    transform:rotate(120deg) translateY(-7px);-webkit-animation-delay:.28s}
  .flower b:nth-child(4){-webkit-transform:rotate(180deg) translateY(-7px);
    transform:rotate(180deg) translateY(-7px);-webkit-animation-delay:.42s}
  .flower b:nth-child(5){-webkit-transform:rotate(240deg) translateY(-7px);
    transform:rotate(240deg) translateY(-7px);-webkit-animation-delay:.56s}
  .flower b:nth-child(6){-webkit-transform:rotate(300deg) translateY(-7px);
    transform:rotate(300deg) translateY(-7px);-webkit-animation-delay:.70s}
  .flower i{position:absolute;left:50%;top:50%;width:3px;height:3px;
    margin:-1.5px 0 0 -1.5px;border-radius:50%;background:#8c8c8c}
  @-webkit-keyframes bloom{0%,100%{opacity:.16}40%{opacity:1}}
  @keyframes bloom{0%,100%{opacity:.16}40%{opacity:1}}
  .empty{display:none;position:absolute;left:0;right:0;top:42%;text-align:center;
    color:#5d5d5d;font-size:13px;letter-spacing:.06em}
  .empty.on{display:block}

  /* schedule screen: the day, nothing else */
  .sched{display:none;position:absolute;left:0;right:0;top:49px;bottom:64px;
    overflow-y:auto;padding:14px 14px 8px;background:#000;line-height:1.25;
    font-family:-apple-system,"Hiragino Sans",sans-serif}
  .sched.on{display:block}
  .sched .now{font-size:26px;line-height:1.2;font-weight:600;color:#f2f2f2;
    text-align:center;word-wrap:break-word}
  .sched .nowat{font-size:20px;color:#c9c9c9;text-align:center;margin-top:2px}
  .sched .date{font-size:12px;color:#9a9a9a;text-align:center;margin:10px 0 4px}
  .sched .axis{position:relative;height:24px;margin:2px 0 0}
  .sched .axis .line{position:absolute;left:0;right:0;top:11px;height:2px;background:#3a3a3a}
  .sched .axis .dot{position:absolute;top:7px;width:10px;height:10px;margin-left:-5px;
    border-radius:50%;background:#fff;border:2px solid #000}
  .sched .ticks{position:relative;height:14px;font-size:10px;color:#7d7d7d}
  .sched .ticks span{position:absolute;top:0;white-space:nowrap}
  .sched .it{display:-webkit-box;display:flex;padding:5px 0;border-top:1px solid #171717}
  .sched .it .t{width:44px;font-size:10px;color:#7d7d7d;padding-top:2px}
  .sched .it .b{-webkit-box-flex:1;flex:1}
  .sched .it .ti{font-size:13px;line-height:1.25;color:#e6e6e6}
  .sched .it .no{font-size:11px;color:#8a8a8a;margin-top:2px}
  .sched .it.cur .ti{color:#fff}
  .sched .it.cur .t{color:#d0d0d0}

</style>
</head>
<body>

  <img class="hd" src="header.png" alt="">

  <div class="sched" id="sched">
    <div class="now" id="now-title">&nbsp;</div>
    <div class="nowat" id="now-at"></div>
    <div class="date" id="sched-date"></div>
    <div class="axis" id="axis"><div class="line"></div><div class="dot" id="dot"></div></div>
    <div class="ticks" id="ticks"></div>
    <div id="sched-list"></div>
  </div>

  <div class="thread" id="thread">
    <div class="empty" id="empty">No messages</div>
    <div class="rec" id="rec">
      <span class="bars"><b></b><b></b><b></b><b></b></span>
      <span class="t" id="rec-text">Listening</span>
    </div>
    <div class="typing" id="typing">
      <div class="flower"><b></b><b></b><b></b><b></b><b></b><b></b><i></i></div>
      <span class="t" id="typing-text">Thinking</span>
    </div>
  </div>

<script>
/* Poll /api/out every 5s and draw only what is new. */

var API = (function () {
  var m = /[?&]u=([^&]+)/.exec(location.search);
  return m ? decodeURIComponent(m[1]) : 'http://127.0.0.1:8099';
})();

var POLL_MS = 5000;

var thread = document.getElementById('thread');
var typing = document.getElementById('typing');
var typingText = document.getElementById('typing-text');
var since = 0, busy = false;

/* ---------- markdown (just enough) ---------- */
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                  .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function inline(s) {
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2">$1</a>');
  return s;
}
function md(src) {
  var lines = esc(src).split('\n'), out = [], i = 0;
  while (i < lines.length) {
    var l = lines[i];
    if (/^\s*```/.test(l)) {
      var buf = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++;
      out.push('<pre><code>' + buf.join('\n') + '</code></pre>');
      continue;
    }
    if (/^\s*[-*+]\s+/.test(l)) {
      var ul = [];
      while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) {
        ul.push('<li>' + inline(lines[i].replace(/^\s*[-*+]\s+/, '')) + '</li>'); i++;
      }
      out.push('<ul>' + ul.join('') + '</ul>');
      continue;
    }
    if (/^\s*\d+[.)]\s+/.test(l)) {
      var ol = [];
      while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) {
        ol.push('<li>' + inline(lines[i].replace(/^\s*\d+[.)]\s+/, '')) + '</li>'); i++;
      }
      out.push('<ol>' + ol.join('') + '</ol>');
      continue;
    }
    var h = l.match(/^(#{1,4})\s+(.*)$/);
    if (h) { out.push('<h3>' + inline(h[2]) + '</h3>'); i++; continue; }
    if (/^\s*$/.test(l)) { i++; continue; }
    out.push('<p>' + inline(l) + '</p>');
    i++;
  }
  return out.join('');
}

/* ---------- view ---------- */
/* The scroll container is not always the same one: on some WebViews the flex
   height collapses and the document scrolls instead. Check both. */
function threadScrolls() { return thread.scrollHeight > thread.clientHeight + 4; }

function activeScroller() {
  if (schedOn) return schedEl;
  return threadScrolls() ? thread : null;
}

function bottom() {
  if (schedOn) { schedEl.scrollTop = schedEl.scrollHeight; return; }
  if (threadScrolls()) thread.scrollTop = thread.scrollHeight;
  else window.scrollTo(0, document.body.scrollHeight);
}

function scrollByPx(dy) {
  if (schedOn) { schedEl.scrollTop = schedEl.scrollTop + dy; return; }
  if (threadScrolls()) thread.scrollTop = thread.scrollTop + dy;
  else window.scrollBy(0, dy);
}

function showError(text) {
  hideTyping();
  addBubble('assistant', text);
  bottom();
}

var emptyEl = document.getElementById('empty');

function updateEmpty() {
  var any = thread.getElementsByClassName('b').length > 0;
  var busy = typing.className.indexOf('on') >= 0;
  emptyEl.className = (!any && !busy) ? 'empty on' : 'empty';
}

function addBubble(role, text) {
  var el = document.createElement('div');
  el.className = 'b ' + (role === 'user' ? 'me' : 'ai');
  if (role === 'user') el.textContent = text;
  else el.innerHTML = md(text);
  thread.appendChild(el);
  updateEmpty();
  return el;
}

var typingSince = 0, typingTimer = null;

function showTyping(label) {
  if (emptyEl) emptyEl.className = 'empty';
  var base = label || 'Thinking';
  if (!typingSince) typingSince = Date.now();
  typingText.textContent = base;
  typing.className = 'typing on';
  thread.appendChild(typing);
  bottom();
  if (!typingTimer) {
    typingTimer = setInterval(function () {
      if (typing.className.indexOf('on') < 0) return;
      var s = Math.floor((Date.now() - typingSince) / 1000);
      typingText.textContent = base + (s > 3 ? ' \u00b7 ' + s + 's' : '');
    }, 1000);
  }
}
function hideTyping() { typing.className = 'typing'; typingSince = 0; updateEmpty(); }

/* called from Java while the recorder is running */
var rec = document.getElementById('rec');
var recText = document.getElementById('rec-text');
var recSince = 0;

function showRecording(label) {
  recText.textContent = label || 'Listening';
  rec.className = 'rec on';
  recSince = Date.now();
  thread.appendChild(rec);
  bottom();
}
function hideRecording() {
  rec.className = 'rec';
  recSince = 0;
}

/* ---------- poll ---------- */
function poll() {
  if (busy) return;
  busy = true;
  var x = new XMLHttpRequest();
  x.open('GET', API + '/api/out?since=' + since, true);
  x.timeout = 15000;
  x.onload = function () {
    busy = false;
    try {
      var d = JSON.parse(x.responseText);
      var ms = d.messages || [];
      // the box was emptied or the gateway restarted: start over, cleanly
      if (d.last !== undefined && d.last < since) { location.reload(); return; }
      for (var i = 0; i < ms.length; i++) {
        addBubble(ms[i].role, ms[i].text);
        since = ms[i].seq;
      }
      var lastRole = ms.length ? ms[ms.length - 1].role : null;
      if (lastRole === 'user') showTyping();
      else if (lastRole === 'assistant') hideTyping();
      if (ms.length) { bottom(); }
      updateEmpty();
    } catch (e) {}
  };
  x.onerror = x.ontimeout = function () {
    busy = false;
    showTyping('Offline');
  };
  x.send();
}

/* ---------- schedule screen (Switch key) ---------- */
var sched = null;
var schedOn = false;
var schedEl = document.getElementById('sched');
var threadEl = document.getElementById('thread');

function two(n) { return (n < 10 ? '0' : '') + n; }

function minutes(hhmm) {
  var p = String(hhmm).split(':');
  return (parseInt(p[0], 10) || 0) * 60 + (parseInt(p[1], 10) || 0);
}

function loadSchedule() {
  var x = new XMLHttpRequest();
  x.open('GET', API + '/api/schedule', true);
  x.timeout = 8000;
  x.onload = function () {
    try { sched = JSON.parse(x.responseText); } catch (e) { sched = null; }
    renderSchedule();
  };
  x.onerror = x.ontimeout = function () { sched = null; renderSchedule(); };
  x.send();
}

function currentIndex(items, now) {
  var idx = 0;
  for (var i = 0; i < items.length; i++) {
    if (minutes(items[i].at) <= now) idx = i;
  }
  return idx;
}

function renderSchedule() {
  if (!schedOn) return;
  var d = new Date();
  var now = d.getHours() * 60 + d.getMinutes();
  var days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  document.getElementById('sched-date').textContent =
    days[d.getDay()] + ', ' + months[d.getMonth()] + ' ' + d.getDate();

  var items = (sched && sched.items) || [];
  var list = document.getElementById('sched-list');
  list.innerHTML = '';
  document.getElementById('now-title').textContent = items.length ? '' : 'No schedule';
  document.getElementById('now-at').textContent = items.length ? '' : 'offline?';

  if (!items.length) {
    return;
  }

  var cur = currentIndex(items, now);
  document.getElementById('now-title').textContent = items[cur].title;
  document.getElementById('now-at').textContent = items[cur].at;

  for (var i = 0; i < items.length; i++) {
    var el = document.createElement('div');
    el.className = 'it' + (i === cur ? ' cur' : '');
    var t = document.createElement('div'); t.className = 't'; t.textContent = items[i].at;
    var b = document.createElement('div'); b.className = 'b';
    var ti = document.createElement('div'); ti.className = 'ti'; ti.textContent = items[i].title;
    b.appendChild(ti);
    if (items[i].note) {
      var no = document.createElement('div'); no.className = 'no'; no.textContent = items[i].note;
      b.appendChild(no);
    }
    el.appendChild(t); el.appendChild(b);
    list.appendChild(el);
  }

  // axis: from the first to the last item, with a dot at now
  var a = minutes(items[0].at), z = minutes(items[items.length - 1].at);
  var span = Math.max(1, z - a);
  var pct = Math.max(0, Math.min(100, ((now - a) / span) * 100));
  document.getElementById('dot').style.left = pct + '%';

  var ticks = document.getElementById('ticks');
  ticks.innerHTML = '';
  var picks = [items[0].at, items[Math.floor(items.length / 3)].at,
               items[Math.floor(items.length * 2 / 3)].at, items[items.length - 1].at];
  for (var k = 0; k < picks.length; k++) {
    var sp = document.createElement('span');
    sp.textContent = picks[k];
    sp.style.left = (k === picks.length - 1 ? 'auto' : (k * 33) + '%');
    if (k === picks.length - 1) sp.style.right = '0';
    ticks.appendChild(sp);
  }

}

function toggleView() {
  schedOn = !schedOn;
  schedEl.className = schedOn ? 'sched on' : 'sched';
  threadEl.style.display = schedOn ? 'none' : 'flex';
  if (schedOn) { renderSchedule(); if (!sched) loadSchedule(); }
  else { bottom(); }
}

/* ---------- called from Java ---------- */
function sk(dy) { scrollByPx(dy); }

function nextPage() {
  if (schedOn) {
    var sh = schedEl.clientHeight;
    if (schedEl.scrollTop + sh >= schedEl.scrollHeight - 4) schedEl.scrollTop = 0;
    else schedEl.scrollTop = schedEl.scrollTop + sh * 0.9;
    return;
  }
  var h = window.innerHeight;
  if (threadScrolls()) {
    if (thread.scrollTop + thread.clientHeight >= thread.scrollHeight - 4) thread.scrollTop = 0;
    else thread.scrollTop = thread.scrollTop + thread.clientHeight * 0.9;
  } else {
    if (window.pageYOffset + h >= document.body.scrollHeight - 4) window.scrollTo(0, 0);
    else window.scrollTo(0, window.pageYOffset + h * 0.9);
  }
}

window.addEventListener('load', function () {
  poll();
  setInterval(poll, POLL_MS);
  setInterval(function () { if (schedOn) renderSchedule(); }, 30000);
});
</script>

</body>
</html>
