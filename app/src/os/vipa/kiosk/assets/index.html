<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>vipa</title>
<style>
  html,body{margin:0;padding:0;background:#000;color:#eaeaea;
    font-family:-apple-system,"Hiragino Sans",sans-serif;
    -webkit-user-select:none;height:100%;
    -webkit-text-size-adjust:none;text-size-adjust:none}
  body{display:-webkit-box;display:flex;-webkit-box-orient:vertical;
    flex-direction:column}

  .hd{-webkit-box-flex:0;flex:0 0 auto;padding:9px 14px 8px;
      border-bottom:1px solid #141414;text-align:center}
  .hd span{font-size:10px;letter-spacing:.24em;color:#6f6f6f}

  .thread{-webkit-box-flex:1;flex:1;overflow-y:auto;overflow-x:hidden;
    padding:14px 0 112px;display:-webkit-box;display:flex;
    -webkit-box-orient:vertical;flex-direction:column}

  .b{max-width:82%;padding:9px 12px;border-radius:16px;
     font-size:15px;line-height:1.5;word-wrap:break-word;
     margin:0 0 11px}
  .ai{-webkit-align-self:flex-start;align-self:flex-start;
      background:#131313;color:#ededed;border:1px solid #222;
      border-bottom-left-radius:4px}
  .me{-webkit-align-self:flex-end;align-self:flex-end;
      background:#f1f1f1;color:#0d0d0d;border-bottom-right-radius:4px;
      white-space:pre-wrap}

  .b p{margin:0 0 6px}
  .b p:last-child{margin-bottom:0}
  .b h3{margin:2px 0 6px;font-size:15.5px;font-weight:600}
  .b ul,.b ol{margin:2px 0 6px;padding-left:19px}
  .b li{margin:1px 0}
  .b strong{font-weight:600;color:#fff}
  .b code{background:#232323;padding:1px 4px;border-radius:4px;font-size:13px}
  .b pre{background:#0c0c0c;border:1px solid #222;border-radius:9px;
    padding:8px 10px;margin:6px 0;overflow-x:auto}
  .b pre code{background:none;padding:0;font-size:12.5px;
    white-space:pre-wrap;word-break:break-word}

  .typing{display:none;-webkit-align-self:flex-start;align-self:flex-start;
    margin:0 0 11px;padding:10px 13px;border-radius:16px;
    border-bottom-left-radius:4px;background:#131313;border:1px solid #222}
  .typing.on{display:-webkit-box;display:flex;-webkit-box-align:center;
    align-items:center}
  .typing .t{font-size:12px;color:#8d8d8d;margin-left:9px}

  .flower{position:relative;width:24px;height:24px;flex:0 0 auto}
  .flower b{position:absolute;left:50%;top:50%;width:5px;height:8px;
    margin:-4px 0 0 -2.5px;border-radius:50%;background:#e9e9e9;opacity:.16;
    -webkit-animation:bloom 1.7s ease-in-out infinite;
    animation:bloom 1.7s ease-in-out infinite}
  .flower b:nth-child(1){-webkit-transform:rotate(0deg) translateY(-7px);
    transform:rotate(0deg) translateY(-7px)}
  .flower b:nth-child(2){-webkit-transform:rotate(60deg) translateY(-7px);
    transform:rotate(60deg) translateY(-7px);-webkit-animation-delay:.14s}
  .flower b:nth-child(3){-webkit-transform:rotate(120deg) translateY(-7px);
    transform:rotate(120deg) translateY(-7px);-webkit-animation-delay:.28s}
  .flower b:nth-child(4){-webkit-transform:rotate(180deg) translateY(-7px);
    transform:rotate(180deg) translateY(-7px);-webkit-animation-delay:.42s}
  .flower b:nth-child(5){-webkit-transform:rotate(240deg) translateY(-7px);
    transform:rotate(240deg) translateY(-7px);-webkit-animation-delay:.56s}
  .flower b:nth-child(6){-webkit-transform:rotate(300deg) translateY(-7px);
    transform:rotate(300deg) translateY(-7px);-webkit-animation-delay:.70s}
  .flower i{position:absolute;left:50%;top:50%;width:3px;height:3px;
    margin:-1.5px 0 0 -1.5px;border-radius:50%;background:#8c8c8c}
  @-webkit-keyframes bloom{0%,100%{opacity:.16}40%{opacity:1}}
  @keyframes bloom{0%,100%{opacity:.16}40%{opacity:1}}
</style>
</head>
<body>

  <div class="hd"><span>vipa</span></div>

  <div class="thread" id="thread">
    <div class="typing" id="typing">
      <div class="flower"><b></b><b></b><b></b><b></b><b></b><b></b><i></i></div>
      <span class="t" id="typing-text">Thinking</span>
    </div>
  </div>

<script>
/* Poll /api/out every 5s and draw only what is new. */

var API = (function () {
  var m = /[?&]u=([^&]+)/.exec(location.search);
  return m ? decodeURIComponent(m[1]) : 'http://127.0.0.1:8099';
})();

var POLL_MS = 5000;

var thread = document.getElementById('thread');
var typing = document.getElementById('typing');
var typingText = document.getElementById('typing-text');
var since = 0, busy = false;

/* ---------- markdown (just enough) ---------- */
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                  .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function inline(s) {
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2">$1</a>');
  return s;
}
function md(src) {
  var lines = esc(src).split('\n'), out = [], i = 0;
  while (i < lines.length) {
    var l = lines[i];
    if (/^\s*```/.test(l)) {
      var buf = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++;
      out.push('<pre><code>' + buf.join('\n') + '</code></pre>');
      continue;
    }
    if (/^\s*[-*+]\s+/.test(l)) {
      var ul = [];
      while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) {
        ul.push('<li>' + inline(lines[i].replace(/^\s*[-*+]\s+/, '')) + '</li>'); i++;
      }
      out.push('<ul>' + ul.join('') + '</ul>');
      continue;
    }
    if (/^\s*\d+[.)]\s+/.test(l)) {
      var ol = [];
      while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) {
        ol.push('<li>' + inline(lines[i].replace(/^\s*\d+[.)]\s+/, '')) + '</li>'); i++;
      }
      out.push('<ol>' + ol.join('') + '</ol>');
      continue;
    }
    var h = l.match(/^(#{1,4})\s+(.*)$/);
    if (h) { out.push('<h3>' + inline(h[2]) + '</h3>'); i++; continue; }
    if (/^\s*$/.test(l)) { i++; continue; }
    out.push('<p>' + inline(l) + '</p>');
    i++;
  }
  return out.join('');
}

/* ---------- view ---------- */
/* The scroll container is not always the same one: on some WebViews the flex
   height collapses and the document scrolls instead. Check both. */
function threadScrolls() { return thread.scrollHeight > thread.clientHeight + 4; }

function bottom() {
  if (threadScrolls()) thread.scrollTop = thread.scrollHeight;
  else window.scrollTo(0, document.body.scrollHeight);
}

function scrollByPx(dy) {
  if (threadScrolls()) thread.scrollTop = thread.scrollTop + dy;
  else window.scrollBy(0, dy);
}

function showError(text) {
  hideTyping();
  addBubble('assistant', text);
  bottom();
}

function addBubble(role, text) {
  var el = document.createElement('div');
  el.className = 'b ' + (role === 'user' ? 'me' : 'ai');
  if (role === 'user') el.textContent = text;
  else el.innerHTML = md(text);
  thread.appendChild(el);
  return el;
}

function showTyping(label) {
  typingText.textContent = label || 'Thinking';
  typing.className = 'typing on';
  thread.appendChild(typing);
  bottom();
}
function hideTyping() { typing.className = 'typing'; }

/* ---------- poll ---------- */
function poll() {
  if (busy) return;
  busy = true;
  var x = new XMLHttpRequest();
  x.open('GET', API + '/api/out?since=' + since, true);
  x.timeout = 15000;
  x.onload = function () {
    busy = false;
    try {
      var d = JSON.parse(x.responseText);
      var ms = d.messages || [];
      // the box was emptied or the gateway restarted: start over, cleanly
      if (d.last !== undefined && d.last < since) { location.reload(); return; }
      for (var i = 0; i < ms.length; i++) {
        addBubble(ms[i].role, ms[i].text);
        since = ms[i].seq;
      }
      var lastRole = ms.length ? ms[ms.length - 1].role : null;
      if (lastRole === 'user') showTyping();
      else if (lastRole === 'assistant') hideTyping();
      if (ms.length) { bottom(); }
    } catch (e) {}
  };
  x.onerror = x.ontimeout = function () {
    busy = false;
    showTyping('Offline');
  };
  x.send();
}

/* ---------- called from Java ---------- */
function sk(dy) { scrollByPx(dy); }

function nextPage() {
  var h = window.innerHeight;
  if (threadScrolls()) {
    if (thread.scrollTop + thread.clientHeight >= thread.scrollHeight - 4) thread.scrollTop = 0;
    else thread.scrollTop = thread.scrollTop + thread.clientHeight * 0.9;
  } else {
    if (window.pageYOffset + h >= document.body.scrollHeight - 4) window.scrollTo(0, 0);
    else window.scrollTo(0, window.pageYOffset + h * 0.9);
  }
}

window.addEventListener('load', function () {
  poll();
  setInterval(poll, POLL_MS);
});
</script>

</body>
</html>
