<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>vipaOS</title>
<style>
  html,body{margin:0;padding:0;background:#000;color:#eaeaea;
    font-family:-apple-system,"Hiragino Sans",sans-serif;
    -webkit-user-select:none;height:100%;
    -webkit-text-size-adjust:none;text-size-adjust:none}
  body{display:flex;flex-direction:column}

  .hd{display:flex;align-items:center;justify-content:center;
      padding:9px 14px 8px;border-bottom:1px solid #141414;flex:0 0 auto}
  .hd .nm{font-size:10px;letter-spacing:.24em;color:#6f6f6f;
          text-transform:uppercase}

  .thread{flex:1;overflow-y:auto;padding:14px 0 78px;
          display:flex;flex-direction:column}
  .thread>*{margin-bottom:11px}
  .thread>*:last-child{margin-bottom:0}

  .face{width:96px;height:96px;align-self:center;
        margin:6px 0 auto;opacity:.55}

  .d{align-self:center;color:#454545;font-size:10px;letter-spacing:.14em;
     margin:6px 0 1px}

  .b{max-width:82%;padding:9px 12px;border-radius:16px;
     font-size:15px;line-height:1.5;word-wrap:break-word}
  .ai{align-self:flex-start;background:#131313;color:#ededed;
      border:1px solid #222;border-bottom-left-radius:4px}
  .me{align-self:flex-end;background:#f1f1f1;color:#0d0d0d;
      border-bottom-right-radius:4px}
  .more{align-self:center;color:#4a4a4a;font-size:11px;padding:6px 0}

  /* markdown */
  .b p{margin:0 0 6px}
  .b p:last-child{margin-bottom:0}
  .b h1,.b h2,.b h3{margin:2px 0 6px;font-size:15.5px;font-weight:600;line-height:1.35}
  .b ul,.b ol{margin:2px 0 6px;padding-left:19px}
  .b li{margin:1px 0}
  .b strong{font-weight:600;color:#fff}
  .b em{font-style:normal;color:#bdbdbd}
  .b code{background:#232323;padding:1px 4px;border-radius:4px;font-size:13px;
    font-family:ui-monospace,Menlo,monospace}
  .b pre{background:#0c0c0c;border:1px solid #222;border-radius:9px;
    padding:8px 10px;margin:6px 0;overflow-x:auto}
  .b pre code{background:none;padding:0;font-size:12.5px;white-space:pre-wrap;word-break:break-word}
  .b a{color:#9ecbff;text-decoration:none}
  .me code{background:#e2e2e2}
  .me strong{color:#000}
  .me em{color:#555}

  .typing{display:none;align-items:center;gap:10px;
          padding:11px 14px;border-radius:16px;border-bottom-left-radius:4px;
          background:#131313;border:1px solid #222;align-self:flex-start}
  .typing.on{display:flex}
  .typing .t{font-size:12px;color:#8d8d8d;letter-spacing:.06em}

  .flower{position:relative;width:26px;height:26px;flex:0 0 auto}
  .flower b{position:absolute;left:50%;top:50%;width:5px;height:8px;
    margin:-4px 0 0 -2.5px;border-radius:50%;background:#e9e9e9;opacity:.16;
    -webkit-animation:bloom 1.7s ease-in-out infinite;
    animation:bloom 1.7s ease-in-out infinite}
  .flower b:nth-child(1){-webkit-transform:rotate(0deg) translateY(-8px);transform:rotate(0deg) translateY(-8px);-webkit-animation-delay:0s;animation-delay:0s}
  .flower b:nth-child(2){-webkit-transform:rotate(60deg) translateY(-8px);transform:rotate(60deg) translateY(-8px);-webkit-animation-delay:.14s;animation-delay:.14s}
  .flower b:nth-child(3){-webkit-transform:rotate(120deg) translateY(-8px);transform:rotate(120deg) translateY(-8px);-webkit-animation-delay:.28s;animation-delay:.28s}
  .flower b:nth-child(4){-webkit-transform:rotate(180deg) translateY(-8px);transform:rotate(180deg) translateY(-8px);-webkit-animation-delay:.42s;animation-delay:.42s}
  .flower b:nth-child(5){-webkit-transform:rotate(240deg) translateY(-8px);transform:rotate(240deg) translateY(-8px);-webkit-animation-delay:.56s;animation-delay:.56s}
  .flower b:nth-child(6){-webkit-transform:rotate(300deg) translateY(-8px);transform:rotate(300deg) translateY(-8px);-webkit-animation-delay:.70s;animation-delay:.70s}
  .flower i{position:absolute;left:50%;top:50%;width:3px;height:3px;
    margin:-1.5px 0 0 -1.5px;border-radius:50%;background:#8c8c8c}
  @-webkit-keyframes bloom{0%,100%{opacity:.16}40%{opacity:1}}
  @keyframes bloom{0%,100%{opacity:.16}40%{opacity:1}}
</style>
</head>
<body>

  <div class="hd"><span class="nm">vipaos</span></div>

  <div class="thread" id="thread">
    <svg class="face" id="face" viewBox="0 0 120 120">
      <circle cx="60" cy="58" r="34" fill="none" stroke="#d0d0d0" stroke-width="1.8"/>
      <path d="M46 56 q6 7 12 0" fill="none" stroke="#d0d0d0" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M62 56 q6 7 12 0" fill="none" stroke="#d0d0d0" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M56 73 q4 3 8 0" fill="none" stroke="#7a7a7a" stroke-width="2.2" stroke-linecap="round"/>
    </svg>
    <div class="more" id="more" style="display:none">上に古いメッセージ</div>
  </div>

  <div class="typing" id="typing">
    <div class="flower"><b></b><b></b><b></b><b></b><b></b><b></b><i></i></div>
    <span class="t" id="typing-text">考えています</span>
  </div>

  <script>
    /* ---------- tiny markdown ---------- */
    function esc(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function inline(s) {
      s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
      s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
      s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
                    '<a href="$2">$1</a>');
      return s;
    }
    function md(src) {
      var lines = esc(src).split('\n');
      var out = [], i = 0;
      while (i < lines.length) {
        var l = lines[i];
        if (/^\s*```/.test(l)) {
          var buf = []; i++;
          while (i < lines.length && !/^\s*```/.test(lines[i])) { buf.push(lines[i]); i++; }
          i++;
          out.push('<pre><code>' + buf.join('\n') + '</code></pre>');
          continue;
        }
        if (/^\s*[-*+]\s+/.test(l)) {
          var ul = [];
          while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) {
            ul.push('<li>' + inline(lines[i].replace(/^\s*[-*+]\s+/, '')) + '</li>');
            i++;
          }
          out.push('<ul>' + ul.join('') + '</ul>');
          continue;
        }
        if (/^\s*\d+[.)]\s+/.test(l)) {
          var ol = [];
          while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) {
            ol.push('<li>' + inline(lines[i].replace(/^\s*\d+[.)]\s+/, '')) + '</li>');
            i++;
          }
          out.push('<ol>' + ol.join('') + '</ol>');
          continue;
        }
        if (/^\s*&gt;\s?/.test(l)) {
          out.push('<p style="color:#9a9a9a;border-left:2px solid #333;padding-left:8px">'
                   + inline(l.replace(/^\s*&gt;\s?/, '')) + '</p>');
          i++; continue;
        }
        var h = l.match(/^(#{1,4})\s+(.*)$/);
        if (h) {
          var n = Math.min(3, h[1].length);
          out.push('<h' + n + '>' + inline(h[2]) + '</h' + n + '>');
          i++; continue;
        }
        if (/^\s*$/.test(l)) { i++; continue; }
        out.push('<p>' + inline(l) + '</p>');
        i++;
      }
      return out.join('');
    }

    /* ---------- ui ---------- */
    var thread = document.getElementById('thread');
    var more = document.getElementById('more');
    var typing = document.getElementById('typing');
    var typingText = document.getElementById('typing-text');

    var oldest = 0, hasMore = false, loading = false;
    var cur = null, curText = '';

    function fmt(ts) {
      var d = new Date(ts);
      if (isNaN(d)) return '';
      return (d.getMonth() + 1) + '月' + d.getDate() + '日';
    }
    function bottom() { thread.scrollTop = thread.scrollHeight; }

    function addBubble(role, text, prepend) {
      var el = document.createElement('div');
      el.className = 'b ' + (role === 'user' ? 'me' : 'ai');
      if (role === 'user') el.textContent = text;
      else el.innerHTML = md(text);
      if (prepend) thread.insertBefore(el, more.nextSibling);
      else thread.appendChild(el);
      return el;
    }
    function addDate(label, prepend) {
      var el = document.createElement('div');
      el.className = 'd';
      el.textContent = label;
      if (prepend) thread.insertBefore(el, more.nextSibling);
      else thread.appendChild(el);
    }
    function render(msgs, prepend) {
      var last = null;
      for (var i = 0; i < msgs.length; i++) {
        var d = fmt(msgs[i].ts);
        if (d !== last) { addDate(d, prepend); last = d; }
        addBubble(msgs[i].role, msgs[i].text, prepend);
      }
    }

    function loadNewest() {
      var x = new XMLHttpRequest();
      x.open('GET', '/api/messages?limit=6', true);
      x.onload = function () {
        try {
          var d = JSON.parse(x.responseText);
          render(d.messages, false);
          hasMore = d.has_more;
          if (d.messages.length) oldest = d.messages[0].seq;
          more.style.display = hasMore ? 'block' : 'none';
          if (hasMore) thread.insertBefore(more, thread.children[1]);
          bottom();
        } catch (e) {}
      };
      x.send();
    }

    function loadOlder() {
      if (!hasMore || loading) return;
      loading = true;
      var h = thread.scrollHeight;
      var x = new XMLHttpRequest();
      x.open('GET', '/api/messages?limit=6&before=' + oldest, true);
      x.onload = function () {
        try {
          var d = JSON.parse(x.responseText);
          render(d.messages, true);
          hasMore = d.has_more;
          if (d.messages.length) oldest = d.messages[0].seq;
          more.style.display = hasMore ? 'block' : 'none';
          thread.scrollTop = thread.scrollHeight - h + 40;
        } catch (e) {}
        loading = false;
      };
      x.send();
    }

    thread.addEventListener('scroll', function () {
      if (thread.scrollTop <= 2) loadOlder();
    });

    function showTyping(label) {
      typingText.textContent = label || '考えています';
      typing.className = 'typing on';
      thread.appendChild(typing);
      bottom();
    }
    function hideTyping() { typing.className = 'typing'; }

    function ensureCur() {
      if (!cur) {
        cur = document.createElement('div');
        cur.className = 'b ai';
        curText = '';
        thread.appendChild(cur);
      }
      return cur;
    }

    function handle(ev) {
      if (ev.type === 'user') {
        hideTyping(); cur = null; curText = '';
        addBubble('user', ev.message.text, false);
        bottom();
      } else if (ev.type === 'status') {
        showTyping(ev.text);
      } else if (ev.type === 'delta') {
        hideTyping();
        var el = ensureCur();
        curText += ev.text;
        el.innerHTML = md(curText);
        bottom();
      } else if (ev.type === 'done') {
        hideTyping();
        if (cur) { cur.innerHTML = md(ev.message.text); cur = null; curText = ''; }
        else { addBubble('assistant', ev.message.text, false); }
        bottom();
      } else if (ev.type === 'error') {
        hideTyping();
        addBubble('assistant', 'エラー: ' + ev.text, false);
        bottom();
      }
    }

    function connect() {
      var es = new EventSource('/api/stream');
      es.onmessage = function (e) {
        try { handle(JSON.parse(e.data)); } catch (err) {}
      };
      es.onerror = function () {
        es.close();
        setTimeout(function () { location.reload(); }, 4000);
      };
    }

    function nextPage() {
      if (thread.scrollTop + thread.clientHeight >= thread.scrollHeight - 4) {
        thread.scrollTop = 0;
        loadOlder();
      } else {
        thread.scrollTop = thread.scrollTop + thread.clientHeight * 0.9;
      }
    }
    function sk(dy) {
      thread.scrollTop = thread.scrollTop + dy;
      if (thread.scrollTop <= 2) loadOlder();
    }

    window.addEventListener('load', function () { loadNewest(); connect(); });
  </script>

</body>
</html>
